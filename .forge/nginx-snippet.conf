# Pegar en Forge → Site → Files → Edit Nginx Configuration
# (dentro del server { ... } existente)
#
# En el sitio Forge:
# - Web Directory: dejar VACÍO (la app vive en la raíz, no en /public)
# - PHP 8.2
# - No es un proyecto Laravel

client_max_body_size 64M;

location /runfood {
    if (!-e $request_filename) {
        rewrite ^/runfood/(.*)$ /runfood/index.php/$1 last;
    }
}

location / {
    try_files $uri $uri/ =404;
}

location ~ \.php(?:$|/) {
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
}

location ~ /\.(?!well-known).* {
    deny all;
}
